server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # 静态资源读取失败时返回 404，不允许回退到首页。
  location ^~ /assets/ {
    try_files $uri =404;
  }

  # 入口页每次重新验证，避免继续引用旧版本资源。
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri /index.html;
  }
}
